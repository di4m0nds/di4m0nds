name: "[BOT] Update README"

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      - name: Generate README
        run: go run .

      - name: Commit and push if changed
        run: |
          git config --local user.email "ws.2000.sja@gmail.com"
          git config --local user.name "di4m0nds"
          git add README.md
          git diff --staged --quiet || git commit -m "chore(readme): sync latest blog posts [skip ci]" && git push origin main
